name: lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '.clang-format'
  push:
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '.clang-format'

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install clang-format
      run: python -m pip install clang-format==21.1.2

    - name: Check changed C and C++ files
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
           [[ -z "$BASE_SHA" ]] ||
           [[ "$BASE_SHA" =~ ^0+$ ]]; then
          BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
        fi

        mapfile -d '' files < <(
          git diff --name-only -z --diff-filter=ACMR \
            "$BASE_SHA" "$GITHUB_SHA" -- \
            '*.c' '*.cpp' '*.h' '*.hpp'
        )

        if (( ${#files[@]} == 0 )); then
          echo "No changed C or C++ files to check."
          exit 0
        fi

        clang-format --dry-run --Werror "${files[@]}"
