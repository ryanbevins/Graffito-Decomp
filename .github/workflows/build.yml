name: Repository check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Ninja
      run: python -m pip install ninja

    - name: Check Python sources
      run: python -m compileall -q configure.py tools

    - name: Generate build files
      run: python configure.py --no-progress

    - name: Validate build graph
      run: ninja -n

    # A complete build requires a legally obtained game image and the original
    # compiler. Those inputs are intentionally not stored in this repository
    # or in public CI.
