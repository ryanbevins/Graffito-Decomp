<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-labelledby="title description">
  <title id="title">Join the Graffito Workshop on Discord</title>
  <desc id="description">A community invitation for Graffito Decomp contributors and Super Mario Sunshine reverse-engineering enthusiasts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313657"/>
      <stop offset="0.55" stop-color="#454ca0"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="920" height="180" rx="22" fill="url(#background)"/>
  <circle cx="790" cy="20" r="105" fill="#ffffff" opacity="0.045"/>
  <circle cx="875" cy="162" r="82" fill="#161936" opacity="0.09"/>
  <path d="M0 144 C145 110 242 187 392 151 C524 120 637 119 760 159 C824 180 872 179 920 161 V180 H0 Z" fill="#171a38" opacity="0.16"/>

  <g transform="translate(42 36)" filter="url(#shadow)">
    <rect width="108" height="108" rx="28" fill="#ffffff"/>
    <path d="M78 34c-7-3-13-4-19-5l-2 4c-8-1-14-1-22 0l-2-4c-7 1-13 3-19 5C4 49 1 63 2 77c8 6 15 9 23 11l6-8c-3-1-6-3-9-5l2-2c17 8 35 8 52 0l3 2c-3 2-6 4-9 5l6 8c8-2 15-5 23-11 1-17-3-31-13-43h-8z" fill="#5865f2" transform="translate(4 1)"/>
    <circle cx="42" cy="59" r="6" fill="#ffffff"/>
    <circle cx="70" cy="59" r="6" fill="#ffffff"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#ffffff">
    <text x="178" y="54" font-size="14" font-weight="700" letter-spacing="2.2" opacity="0.78">GRAFFITO DECOMP COMMUNITY</text>
    <text x="178" y="91" font-size="31" font-weight="750">Join the Graffito Workshop</text>
    <text x="178" y="121" font-size="16" opacity="0.88">Discuss the decomp, share findings, and collaborate with contributors.</text>
  </g>

  <g transform="translate(718 65)" filter="url(#shadow)">
    <rect width="160" height="50" rx="25" fill="url(#button)"/>
    <text x="80" y="31" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="0.7" fill="#424aa1">JOIN DISCORD  &#8594;</text>
  </g>
</svg>
